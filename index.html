<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KIS-dashboard COPD-ketenzorg</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="app"></div>

  <template id="login-template">
    <main class="login-shell">
      <section class="login-card">

        <div class="brand-row">
          <div class="brand-mark">KIS</div>
          <div>
            <p class="eyebrow">Prototype • nieuwe praktijksituatie</p>
            <h1>KIS-dashboard COPD-ketenzorg</h1>
          </div>
        </div>

        <p class="lead">
          Kies een testrol. De interface toont daarna alleen de functies die voor die stakeholder relevant zijn.
        </p>

        <div class="role-grid">
          <button class="role-button" data-role="huisarts">
            <span class="role-title">Huisarts</span>
            <span>
              Regie, patiëntoverzicht, testgegevens toevoegen en verwijzing naar de longarts.
            </span>
          </button>

          <button class="role-button" data-role="longarts">
            <span class="role-title">Longarts</span>
            <span>
              Verwijzing bekijken, diagnostiek toevoegen, GOLD-classificatie en behandeladvies.
            </span>
          </button>

          <button class="role-button" data-role="fysiotherapeut">
            <span class="role-title">Fysiotherapeut</span>
            <span>
              Longfunctie, beweegdoelen, beperkingen, inspanningsklachten en voortgang.
            </span>
          </button>
        </div>

        <details class="demo-details">
          <summary>Testaccounts</summary>
          <p>
            Voor deze prototypeversie is geen wachtwoord nodig. Dit past bij de fictieve UAT-testsetting.
          </p>
        </details>

      </section>
    </main>
  </template>

  <script src="app.js"></script>
</body>
</html>
